<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="contstyle.css">
    <link rel="stylesheet" href="https://fonts.google.com/specimen/Montserrat">
</head>
<body>
    <div class="general">
    <nav>
             <div class="titulo">
                <a href="index.html"><h2>ÁUREA</h2></a>
            </div>
            <ul>
                <li><a href="srv.html">SERVICIOS</a></li>
                <li><a href="sm.html">SOBRE MI</a></li>
                <li><a href="equipo.html">EQUIPO</a></li>
                <li><a href="cont.html">CONTACTO</a></li>
            </ul>
        </nav>
    <div class="gen">
            <div class="tit">
                <h1>Agenda tu cita</h1>
            </div>
            <br><br>
            <div class="form">
                <form id="miFormulario">
        <center>
            
        <label>NOMBRE</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label>APELLIDO</label><br>
        <input type="text" id="apellido" name="apellido" required><br><br>

        <label>SERVICIO</label><br>
        <input type="text" id="servicio" name="servicio" required><br><br>

        <label>FECHA</label><br>
        <input type="text" id="fecha" name="fecha" required><br><br>
        </center>
        <button type="submit">Enviar</button>
    </form>
    
    <p class="mensaje" id="mensaje"></p>
        </div>
    </div>
    </div>
    <script>

    const url = "https://script.google.com/macros/s/AKfycbydj_Q6kQbEyTNVGfjQHxT_AQLYitxWLS3Mriv7WolI9EDOI5pfpFyJM1aVIQH4Q-wt/exec"

    document.getElementById("miFormulario")
    .addEventListener("submit", function(e){

        e.preventDefault();

        const datos = {
            nombre: document.getElementById("nombre").value,
            apellido: document.getElementById("apellido").value,
            servicio: document.getElementById("servicio").value,
            fecha: document.getElementById("fecha").value,
        };

        fetch(url, {
            method:"POST",
            body:JSON.stringify(datos)
        }) 
        .then(res => res.json())
        .then(data => {
            document.getElementById("mensaje").innerHTML =
            "Datos guardados correctamente";
            document.getElementById("miFormulario").reset();
        })
        .catch(error => {
            document.getElementById("mensaje").innnerHTML =
            "Error al guardar";
        });
    });
    </script>
    </div>
</body>
</html>
